[package]
name = "desktop-tauri"
version = "0.0.0"
description = "Desktop shell for Discord Clone, built with Tauri."
edition = "2021"
rust-version = "1.98"

[lib]
name = "desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small binary: trade build time and a little speed for a smaller file.
# This matters because the app ships to friends over a home internet link.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
