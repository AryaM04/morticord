[package]
name = "crypto-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features: the libolm pickle format and the precomputed
# Ed25519 tables are not needed, and they make the WASM file larger.
# "low-level-api" gives the pickle cipher for the standalone signing key.
vodozemac = { version = "0.11", default-features = false, features = ["wasm_js", "low-level-api"] }
wasm-bindgen = "0.2"

[profile.release]
# Make the WASM file small. The client loads it only when E2EE starts.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
