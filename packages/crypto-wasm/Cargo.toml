[package]
name = "crypto-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "0.11", features = ["wasm_js"] }
wasm-bindgen = "0.2"

[profile.release]
# Make the WASM file small. The client loads it only when E2EE starts.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
