# coturn configuration for the production stack.
#
# infra/coturn/start.sh adds the secret to a copy of this file. The realm,
# the external IP, the relay port range and the certificate paths come in
# as command-line flags from docker-compose.yml and start.sh.

use-auth-secret
listening-port=3478
tls-listening-port=5349

fingerprint
no-cli
no-software-attribute
no-multicast-peers
# The clients relay UDP only. Do not relay TCP to peers (RFC 6062).
no-tcp-relay
# Do not answer NAT behavior tests (RFC 5780). The clients do not use them,
# and the extra answers make the server a better reflector for attacks.
no-rfc5780
# A nonce is valid for 10 minutes.
stale-nonce=600
# coturn runs without root rights, so it cannot write to /var/run.
pidfile=/tmp/turnserver.pid
# Send the log to standard output, so "docker compose logs" shows it.
log-file=stdout
simple-log

# Quotas keep one user from using all server capacity. See
# turnserver.conf for the reason for these numbers.
user-quota=20
total-quota=90

# Do not allow a peer address in a private range. Without these lines,
# a user could use the TURN server to reach the devices of the home
# network. This list covers the loopback, private, shared, link-local,
# documentation, benchmark, multicast and reserved IPv4 ranges, and the
# loopback, unique-local, link-local, site-local, multicast, IPv4-mapped,
# NAT64, 6to4, Teredo, discard and documentation IPv6 ranges. It is the
# same list as the one of the link preview fetch
# (packages/link-preview-fetch/src/address-check.ts).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:0:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
