# coturn configuration for local development.
#
# Development note: this file allows loopback and LAN peer addresses, so
# that two computers on the same home network can test calls. Production
# must deny loopback and all private ranges (see docker-compose.prod.yml),
# so that nobody can use the TURN server to reach the home LAN.

use-auth-secret
# The real secret and the external IP come in as command-line flags, set
# from .env by docker-compose.dev.yml. Command-line flags override a
# value set here, so no secret value needs to sit in this file or the
# image. See docker-compose.dev.yml for the reason.

listening-port=3478
tls-listening-port=5349

# The relay port range comes from .env (see docker-compose.dev.yml).

fingerprint
no-cli

# Quotas keep one user from using all server capacity.
#
# The math for user-quota: one client in an N-peer call holds one peer
# connection to each other client, so N-1 connections. Each peer
# connection can open a relay allocation on each TURN URL we offer
# (UDP and TCP; see apps/server/src/modules/voice/routes.ts), so up to
# 2 allocations per connection in the worst case, where every peer
# needs the relay. For a 10-peer call: 9 connections times 2 is 18.
# user-quota=12 was too low for that; a real call above about 7 peers
# could hit "486 Allocation Quota Reached" and lose relay candidates.
# Set to 20 for headroom above the 18 a 10-peer call needs.
user-quota=20
# total-quota bounds server-wide concurrent allocations. The relay
# port range (TURN_RELAY_MIN_PORT..TURN_RELAY_MAX_PORT in .env) is
# 100 ports by default, and coturn needs one port per allocation, so
# total-quota above about 90 cannot be met anyway: the port range, not
# this number, is the real ceiling on how many peers can be relayed
# at once. Set to 90 so the two stay consistent. Raise the port range
# first (and measure its Docker Desktop memory and start-up cost) if
# the server must support more relayed calls at the same time.
total-quota=90

# Development only: loopback and LAN peers are allowed, to test calls
# between machines on the same network. Remove these two lines in production.
# allow-loopback-peers
# (LAN ranges are allowed by default when denied-peer-ip is not set below.)
