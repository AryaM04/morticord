# coturn configuration for local development.
#
# Development note: this file allows loopback and LAN peer addresses, so
# that two computers on the same home network can test calls. Production
# must deny loopback and all private ranges (see docker-compose.prod.yml),
# so that nobody can use the TURN server to reach the home LAN.

use-auth-secret
# The real secret and the external IP come in as command-line flags, set
# from .env by docker-compose.dev.yml. Command-line flags override a
# value set here, so no secret value needs to sit in this file or the
# image. See docker-compose.dev.yml for the reason.

listening-port=3478
tls-listening-port=5349

# The relay port range comes from .env (see docker-compose.dev.yml).

fingerprint
no-cli

# Quotas keep one user from using all server capacity.
user-quota=12
total-quota=1200

# Development only: loopback and LAN peers are allowed, to test calls
# between machines on the same network. Remove these two lines in production.
# allow-loopback-peers
# (LAN ranges are allowed by default when denied-peer-ip is not set below.)
