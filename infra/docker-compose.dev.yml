# Development stack: database, TURN server and a mail catcher.
# Start it with: docker compose -f infra/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # coturn does not read the secret or the external IP from the config
  # file at start-up, so both values come in as command-line flags, read
  # from .env. This keeps the secret out of the image and lets the
  # external IP change per host, without editing turnserver.conf.
  #
  # Docker Desktop (Windows and macOS) runs containers inside a hidden VM,
  # so a container never shares the host network. Each TURN port, and the
  # full relay port range, must be published to the host here. The relay
  # candidate address must then be set to the address a peer on the host
  # actually dials (127.0.0.1 for a one-machine dev or test set-up). This
  # same set-up also works on native Linux Docker.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
    ports:
      - "${TURN_PORT}:3478"
      - "${TURN_PORT}:3478/udp"
      - "${TURN_TLS_PORT}:5349"
      - "${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}:${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    mem_limit: 256m

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    mem_limit: 128m

volumes:
  postgres-data:
