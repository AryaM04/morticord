# Development stack: database, TURN server and a mail catcher.
# Start it with: docker compose -f infra/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_DOMAIN: ${TURN_DOMAIN}
      TURN_RELAY_MIN_PORT: ${TURN_RELAY_MIN_PORT}
      TURN_RELAY_MAX_PORT: ${TURN_RELAY_MAX_PORT}
    ports:
      - "${TURN_PORT}:3478"
      - "${TURN_PORT}:3478/udp"
      - "${TURN_TLS_PORT}:5349"
      - "${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}:${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    mem_limit: 256m

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    mem_limit: 128m

volumes:
  postgres-data:
