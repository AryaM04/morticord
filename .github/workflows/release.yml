name: Release

# Build the desktop app for Windows and macOS (Tauri) and for Linux
# (Electron), and put the installers in a draft GitHub release. Push a tag
# such as "v0.1.0" to start it. The tag must match "version" in
# apps/desktop-tauri/src-tauri/tauri.conf.json and in
# apps/desktop-electron/package.json.
#
# Updater signatures need the secret TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD when the key has a password). Without
# the key, the release has installers but no updater files and no
# latest.json. See docs/concepts/desktop-shells.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of the draft release, such as v0.1.0-test.1"
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            # One app for Apple silicon and Intel Macs.
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm

      - name: Install the pinned Rust toolchain
        # rustup reads apps/desktop-tauri/rust-toolchain.toml.
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          rustup toolchain install
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Choose the updater signing
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No updater signature::The secret TAURI_SIGNING_PRIVATE_KEY is not set. This release has no updater files and no latest.json."
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app and upload it to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-tauri
          tauriScript: pnpm exec tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Discord Clone ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: See the assets below for the Windows and macOS installers.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.updater == 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}

  # The Linux app: an AppImage and a deb package for x64, and
  # latest-linux.yml for the AppImage updater. It runs after the Tauri
  # jobs, so that the draft release exists. It makes the draft when those
  # jobs did not make it.
  linux:
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm

      - name: Check that the tag matches the app version
        # The updater compares the version in latest-linux.yml with the installed app.
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./apps/desktop-electron/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The tag $TAG does not match version $VERSION in apps/desktop-electron/package.json."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the AppImage and the deb package
        working-directory: apps/desktop-electron
        run: |
          pnpm --filter @discord-clone/web build
          node build.mjs
          pnpm exec electron-builder --linux AppImage deb --publish never

      - name: Upload the files to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Discord Clone $TAG" --notes "See the assets below for the Windows, macOS and Linux installers."
          fi
          cd apps/desktop-electron/release
          gh release upload "$TAG" ./*.AppImage ./*.deb latest-linux.yml --clobber
