name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: discord_clone
          POSTGRES_PASSWORD: discord_clone
          POSTGRES_DB: discord_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discord_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://discord_clone:discord_clone@localhost:5432/postgres
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Separate job: the Rust tests of the WASM crypto wrapper. rustup reads
  # the pinned toolchain from rust-toolchain.toml in the crate folder.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/crypto-wasm
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Cache the Cargo registry and the build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/crypto-wasm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/crypto-wasm/rust-toolchain.toml', 'packages/crypto-wasm/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Test
        run: cargo test --locked

  # Separate job: the Rust tests of the desktop app (address checks of the
  # link preview fetch, server address, deep links). It runs on Windows,
  # the main desktop target, so it needs no Linux webview packages.
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop-tauri/src-tauri
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Cache the Cargo registry and the build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Add a stub web build
        # The Tauri build step needs the web build folder. The tests do not
        # use its content, so a stub page is enough.
        run: |
          mkdir -p ../../web/dist
          echo "<!doctype html><title>stub</title>" > ../../web/dist/index.html

      - name: Test
        run: cargo test --locked

  # Separate job: browser tests that need a real TURN server. It does
  # not run in the "build" job above, since it needs Docker Compose and
  # a real Chromium engine, and it is slower than a unit test run.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: discord_clone
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: discord_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discord_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --filter @discord-clone/e2e exec playwright install --with-deps chromium

      - name: Copy the environment file
        # On Linux, 127.0.0.1 in the container is not the host. Coturn must
        # announce the host IP, so that relay packets go back through Docker.
        run: |
          HOST_IP=$(hostname -I | awk '{print $1}')
          cp .env.example .env
          sed -i "s/^TURN_EXTERNAL_IP=.*/TURN_EXTERNAL_IP=$HOST_IP/" .env
          echo "TURN_TEST_HOST=$HOST_IP" >> "$GITHUB_ENV"

      - name: Start coturn
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml up -d coturn

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Repeat search and voice settings
        if: always()
        working-directory: e2e
        run: pnpm exec playwright test tests/search.spec.ts tests/voice-settings.spec.ts --repeat-each 4

      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e/test-results
            e2e/.server-data/server.log
          retention-days: 7

      - name: Show the coturn log
        if: failure()
        run: |
          grep TURN_EXTERNAL_IP .env
          docker compose --env-file .env -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml logs coturn | tail -n 80

      - name: Stop coturn
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml down
